services:
  - type: web
    name: strikewise-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: NIFTY Options Pricing API
      - key: MARKET_DATA_PROVIDER
        value: manual

